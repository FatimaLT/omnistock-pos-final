<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo circular degradado -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" opacity="0.1" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Elemento superior: Carrito de compras estilizado -->
  <g transform="translate(50, 50)">
    <!-- Ruedas del carrito -->
    <circle cx="-15" cy="20" r="4" fill="#06b6d4"/>
    <circle cx="15" cy="20" r="4" fill="#06b6d4"/>
    
    <!-- Cuerpo del carrito -->
    <path d="M -20 15 L -18 -8 L 18 -8 L 20 15 Z" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Mango del carrito -->
    <path d="M -15 -10 Q -20 -20 -10 -25" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 15 -10 Q 20 -20 10 -25" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Punto central (representa base de datos) -->
    <circle cx="0" cy="0" r="3" fill="#06b6d4"/>
  </g>
  
  <!-- Detalles de brillo (glassmorphism effect) -->
  <circle cx="30" cy="30" r="8" fill="#ffffff" opacity="0.1"/>
  <circle cx="70" cy="70" r="6" fill="#ffffff" opacity="0.05"/>
</svg>
